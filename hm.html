function renderComments(comments){
  const list = document.getElementById("commentsList");
  if (!list) return;
  const top = comments.filter(c => !c.parent_id);
  const byParent = {};
  comments.filter(c => c.parent_id).forEach(c => {
    byParent[c.parent_id] = byParent[c.parent_id] || [];
    byParent[c.parent_id].push(c);
  });
  if (top.length === 0){ list.innerHTML = "<div class='empty-state' style='padding:30px 10px;'><i>💬</i>No comments yet. Be the first!</div>"; return; }
  list.innerHTML = "";
  top.forEach(c => {
    list.appendChild(buildCommentEl(c, false));
    if (byParent[c.id]) {
      byParent[c.id].forEach(reply => list.appendChild(buildCommentEl(reply, true)));
    }
  });
}

function buildCommentEl(c, isReply){
  const el = document.createElement("div");
  el.className = "comment-item" + (isReply ? " reply" : "");
  el.style.cssText = `display:flex;gap:10px;padding:10px 4px;${isReply ? 'margin-left:38px;border-left:2px solid var(--accent);padding-left:12px;' : ''}`;
  el.innerHTML = `
    <div class="avatar" style="width:32px;height:32px;font-size:12px;flex-shrink:0;">${c.author_avatar ? `<img src="${c.author_avatar}">` : (c.author_name ? c.author_name.charAt(0).toUpperCase() : "?")}</div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;">
        ${escapeHtml(c.author_name)}
        <span style="font-size:10px;color:var(--text-dim);font-weight:400;">${formatRelativeTime(c.timestamp)}</span>
      </div>
      <div style="font-size:14px;color:var(--text-primary);margin-top:2px;word-wrap:break-word;">${escapeHtml(c.content)}</div>
    </div>`;
  return el;
}

async function submitComment(reelId){
  const input = document.getElementById("commentInput");
  const content = input?.value.trim();
  if (!content) return;
  try {
    await api("/api/reels/"+reelId+"/comments", {method:"POST", body: JSON.stringify({content})});
    if (input) input.value = "";
    const r = await api("/api/reels/"+reelId+"/comments");
    renderComments(r.comments || []);
    const countEl = document.getElementById("reelCommentCount"+reelId);
    if (countEl) {
      const reel = reelsData.find(x => x.id === reelId);
      if (reel) { reel.comment_count = (reel.comment_count||0)+1; countEl.textContent = reel.comment_count; }
    }
  } catch(e){ showToast(e.message); }
}

// ==================== CALLS (WebRTC) - FIXED ====================
let pc = null;
let localStream = null;
let remoteStream = null;
let currentCallTargetId = null;
let isVideoCall = false;
let isMuted = false;
let isCameraOff = false;
let callStartTime = null;
let callTimerInterval = null;
let isCallActive = false;
let callRecordSaved = false;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" },
    { urls: "stun:stun3.l.google.com:19302" },
    { urls: "stun:stun4.l.google.com:19302" }
  ],
  iceCandidatePoolSize: 10
};

async function startCall(type){
  console.log("🔵 startCall called with type:", type);
  
  if (!window.isSecureContext) {
    showToast("Calls require HTTPS or localhost");
    return;
  }
  if (!currentChat || currentChat.type !== "dm") {
    showToast("Only direct messages support calls");
    return;
  }
  if (isCallActive) {
    showToast("Already in a call");
    return;
  }
  if (!socket || !socket.connected) {
    showToast("Not connected to server");
    return;
  }
  
  isVideoCall = (type === "video");
  currentCallTargetId = currentChat.id;
  callStartTime = Date.now();
  callRecordSaved = false;
  isCallActive = true;

  console.log("📞 Starting call to:", currentCallTargetId, "video:", isVideoCall);

  // Show call UI
  document.getElementById("callActionsIncoming").classList.add("hidden");
  document.getElementById("callActionsActive").classList.remove("hidden");
  document.getElementById("callOverlay").classList.remove("hidden");
  document.getElementById("callStatus").textContent = "Calling...";
  document.getElementById("callName").textContent = currentChat.name;
  setCallAvatarEl(document.getElementById("callAvatar"), {username: currentChat.name, avatar: currentChat.avatar});
  
  try {
    const constraints = { 
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: isVideoCall ? { width: { ideal: 640 }, height: { ideal: 480 } } : false
    };
    console.log("🎤 Getting user media with constraints:", constraints);
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    console.log("✅ Local stream obtained");
    
    const lv = document.getElementById("localVideo");
    if (isVideoCall) {
      lv.srcObject = localStream;
      lv.classList.remove("hidden");
    } else {
      lv.classList.add("hidden");
    }
    
    createPeerConnection();
    console.log("🔗 Peer connection created");

    // Add all tracks to the peer connection
    localStream.getTracks().forEach(track => {
      if (pc) {
        pc.addTrack(track, localStream);
        console.log("➕ Track added:", track.kind);
      }
    });

    // Create and send offer
    const offer = await pc.createOffer({
      offerToReceiveAudio: true,
      offerToReceiveVideo: isVideoCall
    });
    console.log("📤 Offer created:", offer);
    await pc.setLocalDescription(offer);
    console.log("📝 Local description set");

    socket.emit("call_offer", {
      target: currentCallTargetId,
      offer: offer,
      video: isVideoCall
    });
    console.log("📨 Call offer sent");
    
    startCallTimer();
    
  } catch(err){
    console.error("❌ Error starting call:", err);
    showToast("Could not start call: " + err.message);
    endCall(true);
  }
}

function startCallTimer() {
  if (callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = setInterval(() => {
    if (callStartTime) {
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const mins = Math.floor(elapsed / 60);
      const secs = elapsed % 60;
      document.getElementById("callStatus").textContent = 
        `${mins}:${secs.toString().padStart(2, '0')}`;
    }
  }, 1000);
}

async function handleCallOffer(data){
  console.log("📥 Call offer received from:", data.from_user_id);
  
  if (isCallActive || currentCallTargetId) {
    console.log("⛔ Already in a call, rejecting");
    socket.emit("call_reject", {target: data.from_user_id});
    return;
  }
  if (!data.from_user_id) {
    console.warn("⚠️ Invalid call offer: missing from_user_id");
    return;
  }
  
  currentCallTargetId = data.from_user_id;
  isVideoCall = data.video || false;
  callStartTime = Date.now();
  callRecordSaved = false;
  isCallActive = true;

  const user = {username: data.from_username || "Unknown", avatar: data.from_avatar || null};
  setCallAvatarEl(document.getElementById("callAvatar"), user);
  document.getElementById("callName").textContent = user.username;
  document.getElementById("callStatus").textContent = isVideoCall ? "📹 Incoming video call..." : "📞 Incoming voice call...";

  document.getElementById("callActionsIncoming").classList.remove("hidden");
  document.getElementById("callActionsActive").classList.add("hidden");
  document.getElementById("callOverlay").classList.remove("hidden");

  window._incomingOffer = data.offer;
  window._callerInfo = user;
  console.log("📥 Incoming call offer stored");
  
  // Play ringtone effect (vibration on mobile)
  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }
}

async function acceptCall(){
  console.log("✅ Accepting call");
  
  if (!window._incomingOffer) {
    showToast("No incoming call to accept");
    return;
  }
  
  document.getElementById("callActionsIncoming").classList.add("hidden");
  document.getElementById("callActionsActive").classList.remove("hidden");
  document.getElementById("callStatus").textContent = "Connecting...";

  try {
    const constraints = { 
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: isVideoCall ? { width: { ideal: 640 }, height: { ideal: 480 } } : false
    };
    console.log("🎤 Getting user media for answer");
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    console.log("✅ Local stream obtained for answer");
    
    const lv = document.getElementById("localVideo");
    if (isVideoCall) {
      lv.srcObject = localStream;
      lv.classList.remove("hidden");
    } else {
      lv.classList.add("hidden");
    }
    
    createPeerConnection();
    console.log("🔗 Peer connection created for answer");

    localStream.getTracks().forEach(track => {
      if (pc) {
        pc.addTrack(track, localStream);
        console.log("➕ Track added for answer:", track.kind);
      }
    });

    console.log("📥 Setting remote description");
    await pc.setRemoteDescription(new RTCSessionDescription(window._incomingOffer));
    console.log("✅ Remote description set");
    
    const answer = await pc.createAnswer();
    console.log("📤 Answer created");
    await pc.setLocalDescription(answer);
    console.log("📝 Local description set for answer");

    socket.emit("call_answer", {target: currentCallTargetId, answer: answer});
    console.log("📨 Answer sent");
    
    startCallTimer();
    
  } catch(err){
    console.error("❌ Error accepting call:", err);
    showToast("Failed to accept call: " + err.message);
    endCall(true);
  }
}

async function handleCallAnswer(data){
  console.log("📥 Call answer received");
  if (!pc) {
    console.warn("⚠️ No peer connection for answer");
    return;
  }
  try {
    console.log("📥 Setting remote description from answer");
    await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    console.log("✅ Remote description set from answer");
    document.getElementById("callStatus").textContent = "Connected";
    startCallTimer();
  } catch(e){
    console.error("❌ Error handling call answer:", e);
  }
}

async function handleRemoteIce(data){
  console.log("🧊 ICE candidate received");
  if (!pc || !data.candidate) return;
  try {
    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
    console.log("✅ ICE candidate added");
  } catch(e){
    console.warn("⚠️ Failed to add ICE candidate:", e);
  }
}

function handleCallReject(data){
  console.log("📵 Call rejected");
  showToast("Call declined");
  if (!callRecordSaved) {
    saveCallRecord("declined");
    callRecordSaved = true;
  }
  endCall(true);
}

function handleRemoteEnd(data){
  console.log("📵 Remote end received");
  showToast("Call ended");
  if (!callRecordSaved && callStartTime) {
    saveCallRecord("completed");
    callRecordSaved = true;
  }
  endCall(true);
}

function declineCall(){
  console.log("📵 Declining call");
  if (currentCallTargetId) {
    socket.emit("call_reject", {target: currentCallTargetId});
  }
  if (!callRecordSaved) {
    saveCallRecord("declined");
    callRecordSaved = true;
  }
  endCall(true);
}

function endCall(silent){
  console.log("🔴 Ending call, silent:", silent);
  
  if (callTimerInterval) {
    clearInterval(callTimerInterval);
    callTimerInterval = null;
  }
  
  if (!silent && currentCallTargetId && isCallActive) {
    socket.emit("call_end", {target: currentCallTargetId});
    if (!callRecordSaved && callStartTime) {
      saveCallRecord("completed");
      callRecordSaved = true;
    }
  }
  
  if (localStream) {
    localStream.getTracks().forEach(t => {
      t.stop();
      console.log("⏹️ Track stopped:", t.kind);
    });
    localStream = null;
    console.log("✅ Local stream stopped");
  }
  if (pc) {
    pc.close();
    pc = null;
    console.log("✅ Peer connection closed");
  }
  currentCallTargetId = null;
  isCallActive = false;
  callStartTime = null;
  document.getElementById("callOverlay").classList.add("hidden");
  document.getElementById("remoteVideo").classList.add("hidden");
  document.getElementById("localVideo").classList.add("hidden");
  document.getElementById("cameraBtn").classList.add("hidden");
  console.log("✅ Call ended and UI cleaned up");
}

function saveCallRecord(status) {
  console.log("💾 Saving call record with status:", status);
  if (!currentChat || currentChat.type !== "dm") return;
  const callType = isVideoCall ? "video" : "audio";
  const duration = callStartTime ? Math.floor((Date.now() - callStartTime) / 1000) : 0;
  
  const content = `${callType}:${status}:${duration}`;
  const clientId = makeClientId();
  
  const m = {
    id: clientId,
    chat_type: "dm",
    chat_id: null,
    sender_id: ME.id,
    sender_name: ME.username,
    sender_avatar: ME.avatar,
    msg_type: "call",
    content: content,
    media_path: "",
    timestamp: Date.now()/1000,
    deleted: false,
    reactions: [],
    client_id: clientId,
  };
  
  const body = document.getElementById("messagesBody");
  if (body) {
    const row = buildBubble(m);
    row.classList.add("pending");
    row.dataset.id = clientId;
    body.appendChild(row);
    body.scrollTop = body.scrollHeight;
  }
  
  socket.emit("send_message", {
    chat_type: "dm",
    target: currentChat.id,
    msg_type: "call",
    content: content,
    client_id: clientId,
    reply_to_id: null
  });
  console.log("💾 Call record saved");
}

function createPeerConnection(){
  console.log("🔗 Creating peer connection");
  pc = new RTCPeerConnection(rtcConfig);
  
  pc.onicecandidate = (event) => {
    if (event.candidate && currentCallTargetId && socket) {
      console.log("🧊 Sending ICE candidate");
      socket.emit("call_ice_candidate", {target: currentCallTargetId, candidate: event.candidate});
    }
  };
  
  pc.ontrack = (event) => {
    console.log("📺 Track received from remote:", event.track.kind);
    remoteStream = event.streams[0];
    const rv = document.getElementById("remoteVideo");
    rv.srcObject = remoteStream;
    rv.classList.remove("hidden");
    document.getElementById("callStatus").textContent = "Connected";
    document.getElementById("cameraBtn").classList.toggle("hidden", !isVideoCall);
  };
  
  pc.oniceconnectionstatechange = () => {
    const state = pc?.iceConnectionState;
    console.log("🧊 ICE connection state:", state);
    if (state === "failed") {
      showToast("Connection failed");
      if (!callRecordSaved) {
        saveCallRecord("missed");
        callRecordSaved = true;
      }
      endCall(true);
    }
    if (state === "connected") {
      document.getElementById("callStatus").textContent = "Connected";
    }
    if (state === "disconnected") {
      showToast("Disconnected");
      if (!callRecordSaved) {
        saveCallRecord("missed");
        callRecordSaved = true;
      }
      endCall(true);
    }
  };
  
  pc.onconnectionstatechange = () => {
    console.log("🔗 Connection state:", pc?.connectionState);
  };
  
  console.log("✅ Peer connection created");
}

function toggleMute(){
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  const btn = document.getElementById("muteBtn");
  btn.classList.toggle("active-toggle", isMuted);
  btn.textContent = isMuted ? "🔇" : "🎤";
  console.log("🎤 Mute toggled:", isMuted);
}

function toggleCamera(){
  if (!localStream) return;
  isCameraOff = !isCameraOff;
  localStream.getVideoTracks().forEach(t => t.enabled = !isCameraOff);
  const btn = document.getElementById("cameraBtn");
  btn.classList.toggle("active-toggle", isCameraOff);
  btn.textContent = isCameraOff ? "🎦" : "📷";
  console.log("📷 Camera toggled:", isCameraOff);
}
</script>
