<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wavegram · Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       ROOT VARIABLES & THEMES
    ============================================================ */
    :root {
      --bg-primary: #0c111b;
      --bg-surface: #141c2b;
      --bg-surface-2: #1c283c;
      --bg-surface-3: #25344d;
      --text-primary: #f0f4fa;
      --text-secondary: #b2c9e8;
      --text-dim: #7b94b8;
      --accent: #4f9aff;
      --accent-glow: rgba(79, 154, 255, 0.25);
      --accent-gradient: linear-gradient(145deg, #4f9aff, #7c5cff);
      --accent-gradient-hover: linear-gradient(145deg, #6aafff, #8c6eff);
      --bubble-mine: #2b7fff;
      --bubble-theirs: #1c283c;
      --online: #34d399;
      --danger: #ff5c7a;
      --border-subtle: rgba(255, 255, 255, 0.04);
      --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.5);
      --radius-card: 28px;
      --radius-bubble: 18px;
      --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --chat-bg: radial-gradient(ellipse at 20% 20%, rgba(79, 154, 255, 0.02), transparent 60%);
    }

    /* Theme: Cosmic */
    .theme-cosmic {
      --bg-primary: #0a0a1a;
      --bg-surface: #12122a;
      --bg-surface-2: #1a1a3a;
      --bg-surface-3: #2a2a4a;
      --text-primary: #e8e0ff;
      --text-secondary: #a090d0;
      --text-dim: #7060a0;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.3);
      --accent-gradient: linear-gradient(145deg, #7c5cff, #4f9aff);
      --bubble-mine: #5c3cdf;
      --bubble-theirs: #1a1a3a;
      --chat-bg: radial-gradient(ellipse at 20% 20%, rgba(124, 92, 255, 0.05), transparent 60%);
    }

    /* Theme: Aurora */
    .theme-aurora {
      --bg-primary: #0a1a1a;
      --bg-surface: #0a2a2a;
      --bg-surface-2: #0a3a3a;
      --bg-surface-3: #1a4a4a;
      --text-primary: #d0f0f0;
      --text-secondary: #80c0c0;
      --text-dim: #509090;
      --accent: #34d399;
      --accent-glow: rgba(52, 211, 153, 0.3);
      --accent-gradient: linear-gradient(145deg, #34d399, #0ea5e9);
      --bubble-mine: #1a8a7a;
      --bubble-theirs: #0a2a2a;
      --chat-bg: radial-gradient(ellipse at 20% 20%, rgba(52, 211, 153, 0.05), transparent 60%);
    }

    /* Theme: Sunset */
    .theme-sunset {
      --bg-primary: #1a0a0a;
      --bg-surface: #2a1212;
      --bg-surface-2: #3a1a1a;
      --bg-surface-3: #4a2a2a;
      --text-primary: #f0d0c0;
      --text-secondary: #d09070;
      --text-dim: #a06040;
      --accent: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.3);
      --accent-gradient: linear-gradient(145deg, #f472b6, #fb923c);
      --bubble-mine: #c05070;
      --bubble-theirs: #2a1212;
      --chat-bg: radial-gradient(ellipse at 20% 20%, rgba(244, 114, 182, 0.05), transparent 60%);
    }

    /* Theme: Ocean */
    .theme-ocean {
      --bg-primary: #0a0a1a;
      --bg-surface: #0a1a2a;
      --bg-surface-2: #0a2a3a;
      --bg-surface-3: #1a3a4a;
      --text-primary: #c0e0f0;
      --text-secondary: #70a0c0;
      --text-dim: #4070a0;
      --accent: #0ea5e9;
      --accent-glow: rgba(14, 165, 233, 0.3);
      --accent-gradient: linear-gradient(145deg, #0ea5e9, #06b6d4);
      --bubble-mine: #0a6a8a;
      --bubble-theirs: #0a1a2a;
      --chat-bg: radial-gradient(ellipse at 20% 20%, rgba(14, 165, 233, 0.05), transparent 60%);
    }

    /* Theme: Sakura */
    .theme-sakura {
      --bg-primary: #1a0a14;
      --bg-surface: #2a1018;
      --bg-surface-2: #3a1822;
      --bg-surface-3: #4a202a;
      --text-primary: #f0d0d8;
      --text-secondary: #d090a0;
      --text-dim: #a06070;
      --accent: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.3);
      --accent-gradient: linear-gradient(145deg, #f472b6, #ec4899);
      --bubble-mine: #c05080;
      --bubble-theirs: #2a1018;
      --chat-bg: radial-gradient(ellipse at 20% 20%, rgba(244, 114, 182, 0.05), transparent 60%);
    }

    /* Theme: Midnight */
    .theme-midnight {
      --bg-primary: #0a0a0a;
      --bg-surface: #0a0a12;
      --bg-surface-2: #12121a;
      --bg-surface-3: #1a1a22;
      --text-primary: #e0e0e8;
      --text-secondary: #8888a0;
      --text-dim: #505068;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --accent-gradient: linear-gradient(145deg, #8b5cf6, #6366f1);
      --bubble-mine: #5b3cf6;
      --bubble-theirs: #12121a;
      --chat-bg: radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.05), transparent 60%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background 0.4s ease, color 0.4s ease;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

    #app {
      height: 100vh; height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg-primary);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      transition: background 0.4s ease;
    }
    .hidden { display: none !important; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; background: none; color: inherit; }
    input, textarea { font-family: inherit; outline: none; border: none; background: none; color: inherit; }

    /* AUTH SCREEN */
    #authScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 30px;
      background: radial-gradient(ellipse at 30% 20%, #162033, #0a0f18);
      position: relative;
      overflow: hidden;
    }
    #authScreen::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(79, 154, 255, 0.08) 0%, transparent 70%);
      top: -80px; right: -80px;
      border-radius: 50%;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }
    #authScreen::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(124, 92, 255, 0.06) 0%, transparent 70%);
      bottom: -40px; left: -40px;
      border-radius: 50%;
      animation: floatOrb 16s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.2); }
    }
    .auth-logo {
      width: 80px; height: 80px;
      border-radius: 24px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px; font-weight: 800;
      margin: 0 auto 20px;
      box-shadow: 0 12px 32px rgba(79, 154, 255, 0.35);
      position: relative;
      z-index: 1;
      transition: var(--transition-smooth);
    }
    .auth-logo:hover { transform: scale(1.03) rotate(-2deg); }
    .auth-title {
      text-align: center;
      font-size: 28px; font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }
    .auth-title .highlight {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-sub {
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 400;
      margin-bottom: 32px;
      position: relative;
      z-index: 1;
    }
    .field {
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .field input {
      width: 100%;
      padding: 16px 18px;
      background: var(--bg-surface);
      border-radius: 16px;
      font-size: 15px;
      border: 1.5px solid transparent;
      transition: var(--transition-smooth);
      color: var(--text-primary);
      backdrop-filter: blur(4px);
    }
    .field input:focus {
      border-color: var(--accent);
      background: var(--bg-surface-2);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .field input::placeholder { color: var(--text-dim); }
    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--accent-gradient);
      border-radius: 16px;
      font-size: 16px; font-weight: 700;
      color: #fff;
      transition: var(--transition-smooth);
      box-shadow: 0 6px 20px rgba(79, 154, 255, 0.3);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-gradient-hover);
      opacity: 0;
      transition: var(--transition-smooth);
    }
    .btn-primary:hover::after { opacity: 1; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary span { position: relative; z-index: 2; }
    .auth-switch {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-secondary);
      position: relative;
      z-index: 1;
    }
    .auth-switch span {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .auth-switch span:hover { color: #6aafff; }
    .auth-error {
      background: rgba(255, 92, 122, 0.12);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 92, 122, 0.15);
      position: relative;
      z-index: 1;
    }

    /* APP BAR */
    .appbar {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 4;
    }
    .appbar h1 {
      font-size: 20px; font-weight: 700;
      flex: 1;
      letter-spacing: -0.3px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      transition: var(--transition-smooth);
      background: rgba(255,255,255,0.03);
      position: relative;
    }
    .icon-btn:active { background: rgba(255,255,255,0.08); transform: scale(0.92); }
    .icon-btn .badge {
      position: absolute; top: -2px; right: -2px;
      background: var(--danger);
      color: #fff;
      font-size: 10px; font-weight: 700;
      min-width: 18px; height: 18px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
      box-shadow: 0 2px 8px rgba(255, 92, 122, 0.4);
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      transition: var(--transition-smooth);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* TABS */
    .tabs {
      display: flex;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      padding: 0 4px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 14px 0 12px;
      font-size: 13px; font-weight: 600;
      color: var(--text-dim);
      border-bottom: 2.5px solid transparent;
      transition: var(--transition-smooth);
      letter-spacing: 0.3px;
    }
    .tab.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    .tab:active { opacity: 0.6; }

    /* SEARCH */
    .search-bar {
      padding: 12px 16px;
      background: var(--bg-surface);
      flex-shrink: 0;
    }
    .search-bar input {
      width: 100%;
      background: var(--bg-surface-2);
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 14px;
      border: 1.5px solid transparent;
      transition: var(--transition-smooth);
      color: var(--text-primary);
    }
    .search-bar input:focus {
      border-color: var(--accent);
      background: var(--bg-surface-3);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .search-bar input::placeholder { color: var(--text-dim); }

    /* LIST */
    #listScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .list-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0;
    }
    .list-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      transition: var(--transition-smooth);
      border-bottom: 1px solid var(--border-subtle);
      animation: fadeSlide 0.25s ease-out;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .list-item:active { background: rgba(255,255,255,0.04); }
    .list-item .avatar { width: 52px; height: 52px; font-size: 20px; position: relative; }
    .status-dot {
      position: absolute; bottom: -1px; right: -1px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--online);
      border: 2.5px solid var(--bg-surface);
      box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.3);
    }
    .status-dot.offline { background: var(--danger); box-shadow: 0 0 0 1px rgba(255, 92, 122, 0.3); }
    .list-item-content { flex: 1; min-width: 0; }
    .list-item-name { font-size: 16px; font-weight: 600; }
    .list-item-sub {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .list-item-time {
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .list-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px; font-weight: 700;
      min-width: 20px; height: 20px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 6px;
      box-shadow: 0 2px 8px rgba(79, 154, 255, 0.3);
    }
    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 60px 30px;
      font-size: 14px;
      line-height: 1.7;
    }
    .empty-state i { display: block; font-size: 36px; margin-bottom: 16px; opacity: 0.4; }

    /* FAB */
    .fab {
      position: absolute;
      bottom: 80px; right: 20px;
      width: 58px; height: 58px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 28px rgba(79, 154, 255, 0.4);
      z-index: 5;
      transition: var(--transition-smooth);
    }
    .fab:active { transform: scale(0.9); }

    /* BOTTOM NAV */
    .bottom-nav {
      display: flex;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(12px);
    }
    .bn-item {
      flex: 1;
      text-align: center;
      padding: 10px 0 8px;
      font-size: 11px;
      color: var(--text-dim);
      display: flex; flex-direction: column; align-items: center;
      gap: 2px;
      transition: var(--transition-smooth);
    }
    .bn-item.active { color: var(--accent); }
    .bn-ic { font-size: 22px; }

    /* CHAT SCREEN */
    #chatScreen {
      flex: 1; display: none; flex-direction: column;
      overflow: hidden;
      background: var(--bg-primary);
      transition: background 0.4s ease;
    }
    #chatScreen.active { display: flex; }
    #chatScreen .messages {
      background: var(--chat-bg);
      transition: background 0.4s ease;
    }

    .chat-appbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      backdrop-filter: blur(12px);
    }
    .chat-appbar .name-block { flex: 1; min-width: 0; }
    .chat-appbar .name-block .n { font-size: 16px; font-weight: 700; }
    .chat-appbar .name-block .s { font-size: 12px; color: var(--text-secondary); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex; flex-direction: column; gap: 4px;
      -webkit-overflow-scrolling: touch;
      transition: background 0.4s ease;
    }
    .bubble-row {
      display: flex;
      max-width: 100%;
      animation: bubbleIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bubble-row.mine { justify-content: flex-end; }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: var(--radius-bubble);
      font-size: 14.5px;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      transition: var(--transition-smooth);
      position: relative;
    }
    .bubble-row.mine .bubble {
      background: var(--accent-gradient);
      border-bottom-right-radius: 4px;
    }
    .bubble-row.theirs .bubble {
      background: var(--bubble-theirs);
      border-bottom-left-radius: 4px;
    }
    .bubble .sender {
      font-size: 11.5px; font-weight: 700;
      color: #8ecbff;
      margin-bottom: 2px;
    }
    .bubble-row.mine .bubble .sender { display: none; }
    .bubble .time {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      text-align: right;
    }
    .bubble.deleted {
      font-style: italic;
      color: var(--text-dim);
      background: transparent !important;
      border: 1px dashed var(--border-subtle);
    }
    .bubble img, .bubble video { max-width: 100%; border-radius: 12px; display: block; margin-bottom: 4px; }
    .bubble audio { width: 200px; max-width: 60vw; }
    .bubble .gift-emoji { font-size: 52px; display: block; text-align: center; margin: 4px 0; animation: giftFloat 2s ease-in-out infinite; }
    .bubble .gift-label { font-size: 11px; color: rgba(255,255,255,0.6); text-align: center; }
    @keyframes giftFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.05); }
    }

    /* COMPOSER */
    .composer {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
      backdrop-filter: blur(12px);
    }
    .composer textarea {
      flex: 1;
      background: var(--bg-surface-2);
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 14.5px;
      max-height: 100px;
      resize: none;
      line-height: 1.4;
      border: 1.5px solid transparent;
      transition: var(--transition-smooth);
    }
    .composer textarea:focus {
      border-color: var(--accent);
      background: var(--bg-surface-3);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .round-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--bg-surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      transition: var(--transition-smooth);
    }
    .round-btn:active { transform: scale(0.88); }
    .round-btn.send {
      background: var(--accent-gradient);
      box-shadow: 0 4px 16px rgba(79, 154, 255, 0.35);
    }
    .round-btn.recording {
      background: var(--danger);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .typing-indicator {
      padding: 4px 18px;
      font-size: 12px;
      color: var(--accent);
      font-style: italic;
      height: 22px;
      transition: var(--transition-smooth);
    }

    /* REELS */
    #reelsScreen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: #000;
      z-index: 10;
    }
    .reels-topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px;
      z-index: 5;
      background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
    }
    .reels-title { font-size: 20px; font-weight: 700; color: #fff; }
    .reels-feed {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .reel-item {
      scroll-snap-align: start;
      height: 100%; width: 100%;
      position: relative;
      display: flex; align-items: flex-end;
      background: #000;
    }
    .reel-item img, .reel-item video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .reel-item video::-webkit-media-controls { display: none !important; }
    .reel-overlay {
      position: relative; z-index: 2;
      width: 100%;
      padding: 16px 14px calc(90px + env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 10%, transparent 55%);
    }
    .reel-info { flex: 1; color: #fff; min-width: 0; }
    .reel-author {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 15px; margin-bottom: 6px;
    }
    .reel-caption { font-size: 14px; line-height: 1.4; opacity: 0.9; }
    .reel-views { font-size: 12px; opacity: 0.7; margin-top: 6px; }
    .reel-actions {
      display: flex; flex-direction: column; align-items: center;
      gap: 18px; padding-bottom: 4px; margin-left: 12px;
    }
    .reel-action {
      color: #fff; text-align: center;
      font-size: 11px; display: flex; flex-direction: column;
      align-items: center; gap: 3px;
    }
    .reel-action .ricon { font-size: 28px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }

    /* OVERLAY & SHEET */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(4, 8, 14, 0.65);
      backdrop-filter: blur(6px);
      z-index: 20;
      display: flex; align-items: flex-end;
      animation: fadeOverlay 0.25s ease-out;
    }
    @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      background: var(--bg-surface);
      width: 100%;
      border-radius: 28px 28px 0 0;
      padding: 24px 22px;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      border-top: 1px solid var(--border-subtle);
      box-shadow: 0 -12px 40px rgba(0,0,0,0.4);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .sheet-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 4px;
      font-size: 15px;
      border-bottom: 1px solid var(--border-subtle);
      transition: var(--transition-smooth);
    }
    .sheet-item:last-child { border-bottom: none; }
    .sheet-item:active { background: rgba(255,255,255,0.04); border-radius: 12px; }
    .sheet-item .ic { font-size: 20px; width: 28px; text-align: center; }
    .sheet-item .role-badge {
      font-size: 10px; padding: 2px 10px; border-radius: 12px;
      background: rgba(79, 154, 255, 0.15); color: var(--accent);
      margin-left: auto;
    }
    .sheet-item .role-badge.admin { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .sheet-item .role-badge.moderator { background: rgba(52, 211, 153, 0.15); color: #34d399; }

    .reaction-picker {
      display: flex; gap: 12px;
      justify-content: space-around;
      padding: 8px 0 16px;
      font-size: 28px;
    }
    .reaction-picker span {
      transition: var(--transition-smooth);
      cursor: pointer;
    }
    .reaction-picker span:active { transform: scale(1.4); }

    /* TOAST */
    .toast {
      position: absolute; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface-3);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      z-index: 50;
      animation: toastFade 2.8s forwards;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
    }
    @keyframes toastFade {
      0%, 70% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(10px); }
    }

    .link-box {
      display: flex; gap: 10px; align-items: center;
      background: var(--bg-surface-2);
      padding: 12px 16px;
      border-radius: 14px;
      margin: 10px 0;
    }
    .link-box input { flex: 1; font-size: 13px; color: var(--text-secondary); }

    /* CALL OVERLAY - BEAUTIFUL DESIGN */
    .call-overlay {
      position: absolute; inset: 0;
      z-index: 60;
      background: radial-gradient(ellipse at 50% 30%, #1a2a3a, #060a10);
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: 50px;
      overflow: hidden;
    }
    .call-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(79, 154, 255, 0.05), transparent 60%),
                  radial-gradient(circle at 70% 80%, rgba(124, 92, 255, 0.05), transparent 60%);
      animation: callPulse 4s ease-in-out infinite alternate;
    }
    @keyframes callPulse {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }
    .remote-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #000;
    }
    .local-video {
      position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 16px;
      width: 110px; height: 150px;
      border-radius: 20px;
      object-fit: cover;
      background: #111;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      border: 2px solid rgba(255,255,255,0.15);
      z-index: 2;
    }
    .call-info {
      position: relative; z-index: 1;
      text-align: center; color: #fff;
      margin-bottom: 40px; margin-top: auto;
      padding-top: 80px;
    }
    .call-info .call-avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      margin: 0 auto 16px;
      border: 3px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: 700;
      background: var(--accent-gradient);
      position: relative;
    }
    .call-info .call-avatar .pulse-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(79, 154, 255, 0.3);
      animation: ringPulse 2s ease-out infinite;
    }
    @keyframes ringPulse {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .call-name { font-size: 26px; font-weight: 700; margin-bottom: 4px; text-shadow: 0 2px 20px rgba(0,0,0,0.3); }
    .call-status { 
      font-size: 15px; 
      opacity: 0.8; 
      background: rgba(0,0,0,0.3); 
      padding: 4px 16px; 
      border-radius: 20px; 
      display: inline-block;
      backdrop-filter: blur(4px);
    }
    .call-actions {
      position: relative; z-index: 2;
      display: flex; gap: 30px; align-items: center;
    }
    .call-btn {
      width: 68px; height: 68px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      transition: var(--transition-smooth);
      border: 2px solid rgba(255,255,255,0.05);
    }
    .call-btn:active { transform: scale(0.9); }
    .call-btn.accept { background: linear-gradient(135deg, #34d399, #059669); }
    .call-btn.decline { background: linear-gradient(135deg, #ff5c7a, #dc2626); }
    .call-btn.secondary {
      background: rgba(255,255,255,0.08);
      width: 56px; height: 56px; font-size: 22px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .call-btn.secondary.active-toggle { background: #fff; color: #111; }

    /* REPLY & EDIT PREVIEW */
    .reply-preview {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; background: var(--bg-surface-2); flex-shrink: 0;
      border-top: 1px solid var(--border-subtle);
    }
    .reply-preview .preview-bar {
      width: 3px; align-self: stretch; background: var(--accent); border-radius: 2px;
    }
    .reply-preview .preview-content { flex: 1; min-width: 0; }
    .reply-preview .preview-name { font-size: 12px; font-weight: 700; color: var(--accent); }
    .reply-preview .preview-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .edit-banner {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; background: var(--bg-surface-2); flex-shrink: 0;
      border-top: 1px solid var(--border-subtle);
    }
    .edit-banner .edit-bar { width: 3px; align-self: stretch; background: #ffb84d; border-radius: 2px; }
    .edit-banner .edit-content { flex: 1; min-width: 0; }
    .edit-banner .edit-label { font-size: 12px; font-weight: 700; color: #ffb84d; }
    .edit-banner .edit-preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* GIFT PICKER */
    .gift-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 12px 0;
      max-height: 350px;
      overflow-y: auto;
    }
    .gift-picker .gift-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      border-radius: 14px;
      background: var(--bg-surface-2);
      border: 2px solid transparent;
      transition: var(--transition-smooth);
      cursor: pointer;
      min-height: 80px;
      justify-content: center;
    }
    .gift-picker .gift-option:hover, .gift-picker .gift-option:active {
      border-color: var(--accent);
      background: var(--bg-surface-3);
      transform: scale(0.96);
    }
    .gift-picker .gift-option .gift-emoji { font-size: 40px; line-height: 1.2; }
    .gift-picker .gift-option .gift-name { font-size: 9px; color: var(--text-dim); margin-top: 4px; text-align: center; }
    .gift-picker .gift-option .gift-category { font-size: 7px; color: var(--text-dim); opacity: 0.5; text-transform: uppercase; letter-spacing: 0.5px; }
    .gift-category-header {
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      padding: 8px 4px 4px; border-bottom: 1px solid var(--border-subtle);
      grid-column: 1 / -1;
    }

    /* RESTRICTION PICKER */
    .restriction-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 0;
    }
    .restriction-picker button {
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 13px;
      transition: var(--transition-smooth);
    }
    .restriction-picker button:hover, .restriction-picker button:active {
      background: var(--bg-surface-3);
      border-color: var(--accent);
      color: var(--text-primary);
    }
    .member-role-select {
      background: var(--bg-surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 6px 12px;
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
    }
    .member-role-select option { background: var(--bg-surface); }
    .restricted-badge {
      font-size: 10px; padding: 2px 10px; border-radius: 12px;
      background: rgba(255, 92, 122, 0.15); color: var(--danger);
      margin-left: 8px;
    }

    /* THEME SELECTOR */
    .theme-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 8px 0;
    }
    .theme-selector .theme-option {
      padding: 12px 8px;
      border-radius: 14px;
      background: var(--bg-surface-2);
      border: 2px solid transparent;
      text-align: center;
      transition: var(--transition-smooth);
      cursor: pointer;
    }
    .theme-selector .theme-option:hover { border-color: var(--accent); }
    .theme-selector .theme-option.active { border-color: var(--accent); background: var(--bg-surface-3); }
    .theme-selector .theme-option .theme-preview {
      width: 40px; height: 40px;
      border-radius: 12px;
      margin: 0 auto 6px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .theme-selector .theme-option .theme-name { font-size: 11px; color: var(--text-dim); }

    @media (max-width: 480px) {
      #app { max-width: 100%; border-radius: 0; }
      .auth-title { font-size: 24px; }
      .sheet { padding: 20px 16px; }
      .local-video { width: 80px; height: 110px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- AUTH SCREEN -->
  <div id="authScreen">
    <div class="auth-logo">WG</div>
    <div class="auth-title">Welcome to <span class="highlight">Wavegram</span></div>
    <div class="auth-sub" id="authSub">Sign in to continue</div>
    <div class="auth-error hidden" id="authError"></div>
    <div id="loginFields">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="doLogin()"><span>Log In</span></button>
      <div class="auth-switch">Don't have an account? <span onclick="toggleAuth(false)">Sign up</span></div>
    </div>
    <div id="registerFields" class="hidden">
      <div class="field"><label>Username</label><input type="text" id="regUsername" placeholder="Your name"></div>
      <div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input type="password" id="regPassword" placeholder="At least 4 characters"></div>
      <button class="btn-primary" onclick="doRegister()"><span>Create Account</span></button>
      <div class="auth-switch">Already have an account? <span onclick="toggleAuth(true)">Log in</span></div>
    </div>
  </div>

  <!-- LIST SCREEN -->
  <div id="listScreen" class="hidden">
    <div class="appbar">
      <h1>Wavegram</h1>
      <div class="icon-btn" onclick="openNotifications()">🔔<span class="badge hidden" id="notifBadge">0</span></div>
      <div class="icon-btn" onclick="openSettings()">⚙️</div>
      <div class="avatar" id="myAvatar" onclick="openSettings()">?</div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tabChats" onclick="switchTab('chats')">Chats</div>
      <div class="tab" id="tabPeople" onclick="switchTab('people')">People</div>
      <div class="tab" id="tabGroups" onclick="switchTab('groups')">Groups</div>
    </div>
    <div class="search-bar">
      <input type="text" id="searchBox" placeholder="Search..." oninput="onSearch(this.value)">
    </div>
    <div class="list-body" id="listBody"></div>
    <div class="fab" onclick="fabAction()">＋</div>
    <div class="bottom-nav">
      <div class="bn-item active" onclick="switchMainScreen('list')"><span class="bn-ic">💬</span>Chats</div>
      <div class="bn-item" onclick="switchMainScreen('reels')"><span class="bn-ic">🎬</span>Reels</div>
    </div>
  </div>

  <!-- REELS SCREEN -->
  <div id="reelsScreen" class="hidden">
    <div class="reels-feed" id="reelsFeed"></div>
    <div class="reels-topbar">
      <div class="reels-title">🎬 Reels</div>
      <div class="icon-btn" style="color:#fff;" onclick="openSettings()">⚙️</div>
    </div>
    <div class="fab" style="bottom:80px;z-index:15;" onclick="openUploadReelSheet()">＋</div>
    <div class="bottom-nav" style="position:absolute;bottom:0;left:0;right:0;">
      <div class="bn-item" onclick="switchMainScreen('list')"><span class="bn-ic">💬</span>Chats</div>
      <div class="bn-item active" onclick="switchMainScreen('reels')"><span class="bn-ic">🎬</span>Reels</div>
    </div>
  </div>

  <input type="file" id="reelFileInput" class="hidden" accept="image/*,video/*">

  <!-- CALL OVERLAY -->
  <div id="callOverlay" class="call-overlay hidden">
    <video id="remoteVideo" autoplay playsinline class="remote-video hidden"></video>
    <video id="localVideo" autoplay playsinline muted class="local-video hidden"></video>
    <div class="call-info">
      <div class="call-avatar" id="callAvatar">
        <div class="pulse-ring"></div>
        <span id="callAvatarText">?</span>
      </div>
      <div class="call-name" id="callName">Call</div>
      <div class="call-status" id="callStatus">Connecting...</div>
    </div>
    <div class="call-actions" id="callActionsIncoming">
      <div class="call-btn decline" onclick="declineCall()">📵</div>
      <div class="call-btn accept" onclick="acceptCall()">📞</div>
    </div>
    <div class="call-actions hidden" id="callActionsActive">
      <div class="call-btn secondary" id="muteBtn" onclick="toggleMute()">🎤</div>
      <div class="call-btn secondary hidden" id="cameraBtn" onclick="toggleCamera()">📷</div>
      <div class="call-btn decline" onclick="endCall()">📵</div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen">
    <div class="chat-appbar">
      <div class="icon-btn" onclick="closeChat()">←</div>
      <div class="avatar" id="chatAvatar">?</div>
      <div class="name-block">
        <div class="n" id="chatName">Chat</div>
        <div class="s" id="chatStatus"></div>
      </div>
      <div class="icon-btn" onclick="openChatThemePicker()">🎨</div>
      <div class="icon-btn hidden" id="voiceCallBtn" onclick="startCall('audio')">📞</div>
      <div class="icon-btn hidden" id="videoCallBtn" onclick="startCall('video')">🎥</div>
      <div class="icon-btn" onclick="openChatMenu()">⋮</div>
    </div>
    <div class="messages" id="messagesBody"></div>
    <div class="typing-indicator" id="typingIndicator"></div>
    <div class="reply-preview hidden" id="replyPreview">
      <div class="preview-bar"></div>
      <div class="preview-content">
        <div class="preview-name" id="replyPreviewName"></div>
        <div class="preview-text" id="replyPreviewText"></div>
      </div>
      <div class="icon-btn" onclick="cancelReply()">✕</div>
    </div>
    <div class="edit-banner hidden" id="editBanner">
      <div class="edit-bar"></div>
      <div class="edit-content">
        <div class="edit-label">Editing message</div>
        <div class="edit-preview" id="editPreviewText"></div>
      </div>
      <div class="icon-btn" onclick="cancelEdit()">✕</div>
    </div>
    <div class="composer">
      <div class="round-btn" onclick="openGiftPicker()">🎁</div>
      <div class="round-btn" onclick="triggerFile('image')">📷</div>
      <div class="round-btn" onclick="triggerFile('video')">🎬</div>
      <textarea id="msgInput" rows="1" placeholder="Message" oninput="onTypingInput()" onkeydown="onComposerKey(event)"></textarea>
      <div class="round-btn" id="voiceBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording(event)" ontouchend="stopRecording(event)">🎤</div>
      <div class="round-btn send" onclick="sendTextMessage()">➤</div>
    </div>
  </div>

  <input type="file" id="fileInput" class="hidden" accept="image/*">
  <input type="file" id="fileInputVideo" class="hidden" accept="video/*">

</div>

<script>
// ============================================================
//  WAVEGRAM – FULL CLIENT LOGIC
// ============================================================

const API = "";
let TOKEN = localStorage.getItem("wg_token") || "";
let ME = JSON.parse(localStorage.getItem("wg_me") || "null");
let socket = null;
let currentChat = null;
let typingTimeout = null;
let mediaRecorder = null, audioChunks = [], recStartTime = 0;
let allGroups = [];
let messageCache = {};
let pendingMessages = {};
let PUBLIC_BASE_URL = "";
let ANIMATIONS_ON = localStorage.getItem("wg_animations") !== "off";
let groupMembersCache = {};
let currentTheme = localStorage.getItem("wg_theme") || "default";

// ---- Apply Theme ----
function applyTheme(theme) {
  const app = document.getElementById("app");
  const chatScreen = document.getElementById("chatScreen");
  const messages = document.getElementById("messagesBody");
  
  // Remove all theme classes
  app.classList.remove('theme-cosmic', 'theme-aurora', 'theme-sunset', 'theme-ocean', 'theme-sakura', 'theme-midnight');
  
  if (theme !== 'default') {
    app.classList.add('theme-' + theme);
  }
  
  currentTheme = theme;
  localStorage.setItem("wg_theme", theme);
}

// ---- GIFTS (extended with categories) ----
const GIFTS = [
  // Love & Romance
  { emoji: "❤️", name: "Red Heart", category: "Love" },
  { emoji: "💕", name: "Two Hearts", category: "Love" },
  { emoji: "💗", name: "Growing Heart", category: "Love" },
  { emoji: "💖", name: "Sparkling Heart", category: "Love" },
  { emoji: "💝", name: "Heart with Ribbon", category: "Love" },
  { emoji: "🌹", name: "Rose", category: "Love" },
  { emoji: "🌷", name: "Tulip", category: "Love" },
  { emoji: "🌸", name: "Cherry Blossom", category: "Love" },
  { emoji: "💐", name: "Bouquet", category: "Love" },
  { emoji: "🥰", name: "Smiling Face with Hearts", category: "Love" },
  { emoji: "😘", name: "Face Blowing a Kiss", category: "Love" },
  
  // Food & Drink
  { emoji: "🎂", name: "Birthday Cake", category: "Food" },
  { emoji: "🍰", name: "Cake", category: "Food" },

// ---- API helper ----
async function api(path, opts={}) {
  opts.headers = opts.headers || {};
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers["Content-Type"] = "application/json";
  }
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

  localStorage.setItem("wg_token", TOKEN);

}

async function doRegister(){
  const username = document.getElementById("regUsername").value.trim();

  try {

    showList(); connectSocket();
  } catch(e){ showAuthError(e.message); }
}

async function doLogin(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  try {
    const r = await api("/api/login", {method:"POST", body: JSON.stringify({email,password})});
    TOKEN = r.token; ME = r.user; saveSession();
    showList(); connectSocket();
  } catch(e){ showAuthError(e.message); }
}

function logout(silent){
  if (!silent) api("/api/logout", {method:"POST"}).catch(()=>{});
  localStorage.removeItem("wg_token"); localStorage.removeItem("wg_me");
  TOKEN = ""; ME = null;
  if (socket) socket.disconnect();
  showAuth();
}

function connectSocket(){
  socket = io({transports:["websocket","polling"]});
  socket.on("connect", () => socket.emit("auth", {token: TOKEN}));
  socket.on("auth_ok", (data) => {
    console.log("Socket authenticated:", data);
  });
  socket.on("auth_error", (data) => {
    console.error("Socket auth error:", data);
    showToast("Session expired, please login again");
    logout(true);
  });
  socket.on("new_message", handleIncomingMessage);
  socket.on("message_deleted", handleMessageDeleted);
  socket.on("message_edited", handleMessageEdited);
  socket.on("message_reacted", handleMessageReacted);
  socket.on("typing", handleTyping);
  socket.on("error_msg", (d) => showToast(d.error));
  socket.on("call_offer", handleCallOffer);
  socket.on("call_answer", handleCallAnswer);
  socket.on("call_ice_candidate", handleRemoteIce);
  socket.on("call_reject", handleCallReject);
  socket.on("call_end", handleRemoteEnd);
  socket.on("call_error", (d) => {
    showToast(d.error || "Call error");
    endCall(true);
  });
  socket.on("group_member_updated", handleGroupMemberUpdate);
  socket.on("account_deleted", () => {
    showToast("This account was deleted");
    localStorage.removeItem("wg_token"); localStorage.removeItem("wg_me");
    TOKEN = ""; ME = null;
    if (socket) socket.disconnect();
    showAuth();
  });
}

// ---- Tabs & Lists ----
let currentTab = "chats";
let allConversations = [];

function switchTab(tab){
  ["chats","people","groups"].forEach(t => {
    const el = document.getElementById("tab"+cap(t));
    if (el) el.classList.toggle("active", t===tab);
  });
  document.getElementById("searchBox").placeholder = tab==="people" ? "Search people..." : (tab==="groups" ? "Search groups..." : "Search...");
  currentTab = tab;
  loadList();
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

async function loadList(){
  const body = document.getElementById("listBody");
  body.innerHTML = "<div class='empty-state'><i>⏳</i>Loading...</div>";
  try {
    if (currentTab === "people") {
      const r = await api("/api/users/search?q=" + encodeURIComponent(document.getElementById("searchBox").value));
      renderPeople(r.users);
    } else if (currentTab === "groups") {
      const r = await api("/api/groups/mine");
      allGroups = r.groups || [];
      renderGroups(allGroups);
    } else {
      const r = await api("/api/conversations");
      allConversations = r.conversations || [];
      renderConversations(filterConversations(document.getElementById("searchBox").value));
    }
  } catch(e){
    body.innerHTML = "<div class='empty-state'><i>⚠️</i>Failed to load</div>";
    showToast(e.message);
  }
}

function filterConversations(q){
  q = (q||"").toLowerCase().trim();
  if (!q) return allConversations;
  return allConversations.filter(c => c.name && c.name.toLowerCase().includes(q));
}

function onSearch(val){
  if (currentTab === "people") loadList();
  else if (currentTab === "groups") renderGroups(allGroups.filter(g => g.name && g.name.toLowerCase().includes(val.toLowerCase())));
  else renderConversations(filterConversations(val));
}

function renderConversations(convos){
  const body = document.getElementById("listBody");
  if (!convos || convos.length === 0){
    body.innerHTML = "<div class='empty-state'><i>💬</i>No conversations yet.<br>Tap <b>People</b> to start a DM, or use ＋ to create a group.</div>";
    return;
  }
  body.innerHTML = "";
  convos.forEach(c => {
    const el = document.createElement("div");
    el.className = "list-item";
    el.onclick = () => c.type === "dm" ? openDM({id:c.id, username:c.name, avatar:c.avatar, status:c.status}) : openGroup(c);
    const preview = (c.last_is_mine ? "You: " : "") + escapeHtml(c.last_preview || "");
    el.innerHTML = `
      <div class="avatar">${c.avatar ? `<img src="${c.avatar}">` : (c.name ? c.name.charAt(0).toUpperCase() : "?")}${c.type==='dm' ? `<div class="status-dot ${c.status==='online'?'':'offline'}"></div>` : ''}</div>
      <div class="list-item-content">
        <div class="list-item-name">${escapeHtml(c.name || "Unknown")}</div>
        <div class="list-item-sub">${preview}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
        <div class="list-item-time">${formatRelativeTime(c.last_timestamp)}</div>
        ${c.unread > 0 ? `<div class="list-badge">${c.unread > 99 ? "99+" : c.unread}</div>` : ""}
      </div>`;
    body.appendChild(el);
  });
}

function formatRelativeTime(ts){
  if (!ts) return "now";
  const now = Date.now()/1000;
  const diff = now - ts;
  const d = new Date(ts*1000);
  if (diff < 60) return "now";
  if (diff < 3600) return Math.floor(diff/60) + "m";
  if (diff < 86400 && d.getDate() === new Date().getDate()) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  if (diff < 172800) return "Yesterday";
  if (diff < 604800) return d.toLocaleDateString([], {weekday:'short'});
  return d.toLocaleDateString([], {day:'2-digit', month:'2-digit', year:'2-digit'});
}

function renderGroups(groups){

// ---- Open Chat ----
function openDM(user){
  currentChat = {type:"dm", id:user.id, name:user.username, avatar:user.avatar, status:user.status};
  enterChatScreen();
  api("/api/messages/dm/"+user.id).then(r => renderMessages(r.messages)).catch(e => showToast(e.message));

  socket.emit("mark_read", {chat_type:"dm", target:user.id});
}

function openGroup(gr){
  currentChat = {type:"group", id:gr.id, name:gr.name, avatar:gr.avatar, role:gr.role, invite_token:gr.invite_token};
  enterChatScreen();
  api("/api/messages/group/"+gr.id).then(r => renderMessages(r.messages)).catch(e => showToast(e.message));
  socket.emit("mark_read", {chat_type:"group", target:gr.id});
  loadGroupMembers(gr.id);
}

// ---- Messages ----
function renderMessages(msgs){
  const body = document.getElementById("messagesBody");
  body.innerHTML = "";
  messageCache = {};
  if (msgs) {
    msgs.forEach(m => { messageCache[m.id] = m; body.appendChild(buildBubble(m)); });
  }
  body.scrollTop = body.scrollHeight;
}

function buildBubble(m){
  const row = document.createElement("div");
  const mine = m.sender_id === ME.id;
  row.className = "bubble-row " + (mine ? "mine" : "theirs");
  row.dataset.id = m.id;

  const bubble = document.createElement("div");
  bubble.className = "bubble" + (m.deleted ? " deleted" : "");
  bubble.oncontextmenu = (e) => { e.preventDefault(); openMessageMenu(m, mine); };
  bubble.ondblclick = () => quickHeartReact(m, bubble);

  let longPressTimer, lastTap = 0;
  bubble.addEventListener("touchstart", () => { longPressTimer = setTimeout(()=>openMessageMenu(m, mine), 450); });
  bubble.addEventListener("touchend", () => {
    clearTimeout(longPressTimer);
    const now = Date.now();
    if (now - lastTap < 300) { quickHeartReact(m, bubble); lastTap = 0; }
    else lastTap = now;
  });

  let inner = "";
  if (currentChat && currentChat.type === "group" && !mine) inner += `<div class="sender">${escapeHtml(m.sender_name)}</div>`;
  if (m.forwarded_from_name && !m.deleted) {
    inner += `<div class="forwarded-label" style="font-size:11px;color:var(--text-dim);font-style:italic;margin-bottom:2px;">↪ Forwarded from ${escapeHtml(m.forwarded_from_name)}</div>`;
  }
  if (m.reply_to && !m.deleted) {
    const rt = m.reply_to;
    const preview = rt.msg_type === "text" ? rt.preview :
      ({image:"📷 Photo", video:"🎬 Video", voice:"🎤 Voice message", gift:"🎁 Gift"}[rt.msg_type] || rt.preview);
    inner += `<div class="quoted-block" style="background:rgba(255,255,255,0.06);border-left:3px solid rgba(255,255,255,0.2);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:12.5px;" onclick="scrollToMessage(${rt.id})">
      <div style="font-weight:700;color:#8ecbff;">${escapeHtml(rt.sender_name)}</div>
      <div style="color:rgba(255,255,255,0.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;">${escapeHtml(preview)}</div>
    </div>`;
  }
  if (m.deleted) {
    inner += "This message was deleted";
  } else if (m.msg_type === "gift") {
    const gift = GIFTS.find(g => g.emoji === m.content) || { emoji: "🎁", name: "Gift", category: "Gift" };
    inner += `<div class="gift-emoji">${gift.emoji}</div>`;
    inner += `<div class="gift-label">🎁 ${escapeHtml(gift.name)}</div>`;
  } else if (m.msg_type === "image") {
    inner += `<img src="${m.media_path}" onclick="openMediaFull('${m.media_path}','image')">`;
  } else if (m.msg_type === "video") {
    inner += `<video src="${m.media_path}" controls></video>`;
  } else if (m.msg_type === "voice") {
    inner += `<audio src="${m.media_path}" controls></audio>`;
  } else if (m.msg_type === "call") {
    const [ctype, status, dur] = (m.content || "audio:missed:0").split(":");
    const isVideo = ctype === "video";
    const icon = isVideo ? "🎥" : "📞";
    let label;
    if (status === "completed") label = `${isVideo ? "Video" : "Voice"} call · ${formatDuration(parseInt(dur) || 0)}`;
    else if (status === "declined") label = `${isVideo ? "Video" : "Voice"} call declined`;
    else label = `Missed ${isVideo ? "video" : "voice"} call`;
    inner += `<div style="display:flex;align-items:center;gap:7px;font-size:13.5px;color:${mine ? 'rgba(255,255,255,0.85)' : 'var(--text-dim)'}"><span style="font-size:15px;">${icon}</span> ${label}</div>`;
  } else {
    inner += escapeHtml(m.content || "");
  }
  inner += `<div class="time">${m.edited && !m.deleted ? "edited · " : ""}${formatTime(m.timestamp)}</div>`;
  bubble.innerHTML = inner;
  renderReactionsInto(bubble, m);

  row.appendChild(bubble);
  return row;
}

function renderReactionsInto(bubble, m){
  bubble.querySelector(".reactions-row")?.remove();
  if (m.deleted || !m.reactions || !m.reactions.length) return;
  const rr = document.createElement("div");
  rr.className = "reactions-row";
  rr.style.cssText = "display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;";
  const counts = {};
  m.reactions.forEach(r => counts[r.emoji] = (counts[r.emoji]||0)+1);
  Object.entries(counts).forEach(([emoji,count]) => {
    const chip = document.createElement("span");
    chip.className = "reaction-chip";
    chip.style.cssText = "background:rgba(255,255,255,0.08);border-radius:10px;padding:1px 8px;font-size:12px;";
    chip.textContent = emoji + (count>1 ? " "+count : "");
    rr.appendChild(chip);
  });
  bubble.appendChild(rr);
}

function formatTime(ts){

  const d = new Date(ts*1000);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function escapeHtml(s){
  if (!s) return "";
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

function formatDuration(totalSeconds){
  if (!totalSeconds) return "0:00";
  const m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
  return `${m}:${s.toString().padStart(2,"0")}`;
}

function appendOptimistic(msgType, content, mediaPath){
  const clientId = makeClientId();
  const m = {
    id: clientId,
    chat_type: currentChat.type,
    chat_id: currentChat.type === "group" ? String(currentChat.id) : null,
    sender_id: ME.id,
    sender_name: ME.username,
    sender_avatar: ME.avatar,
    msg_type: msgType,
    content: content,
    media_path: mediaPath || "",
    timestamp: Date.now()/1000,
    deleted: false,
    reactions: [],
    client_id: clientId,
    reply_to: replyingTo ? {id: replyingTo.id, sender_name: replyingTo.sender_name, preview: replyingTo.preview, msg_type: replyingTo.msg_type} : null,
  };
  const body = document.getElementById("messagesBody");
  const row = buildBubble(m);
  row.classList.add("pending");
  row.dataset.id = clientId;
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  pendingMessages[clientId] = row;
  return clientId;
}

function sendTextMessage(){
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text || !currentChat) return;
  if (document.getElementById("blockBanner")) { showToast("This conversation is unavailable"); return; }

  if (editingMessageId) {
    socket.emit("edit_message", {message_id: editingMessageId, content: text});
    cancelEdit();
    input.value = "";
    return;
  }

  const replyId = replyingTo ? replyingTo.id : null;
  const clientId = appendOptimistic("text", text, "");
  socket.emit("send_message", {
    chat_type: currentChat.type,
    target: currentChat.id,
    msg_type: "text",
    content: text,
    client_id: clientId,
    reply_to_id: replyId
  });
  input.value = "";
  cancelReply();
}

// ---- Voice Recording ----
async function startRecording(e){
  if (e) e.preventDefault();
  if (!currentChat) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (ev) => audioChunks.push(ev.data);
    mediaRecorder.start();
    recStartTime = Date.now();
    document.getElementById("voiceBtn").classList.add("recording");
  } catch(err){ showToast("Microphone access denied"); }
}
function stopRecording(e){
  if (e) e.preventDefault();
  if (!mediaRecorder || mediaRecorder.state==="inactive") return;
  document.getElementById("voiceBtn").classList.remove("recording");
  const duration = Date.now() - recStartTime;
  mediaRecorder.onstop = async () => {
    if (duration < 500) return;
    const blob = new Blob(audioChunks, {type:"audio/webm"});
    const file = new File([blob], "voice.webm", {type:"audio/webm"});
    await uploadAndSend(file, "voice");
  };
  mediaRecorder.stop();
}

function handleIncomingMessage(m){
  const belongsToOpenChat = currentChat && (
    (currentChat.type === "dm" && m.chat_type === "dm" && (m.sender_id === currentChat.id || m.sender_id === ME.id)) ||
    (currentChat.type === "group" && m.chat_type === "group" && String(currentChat.id) === m.chat_id)
  );

  refreshConversationsIfListVisible();
  refreshUnreadBadge();

  if (!belongsToOpenChat) {
    if (m.sender_id !== ME.id) {
      const preview = m.msg_type === "gift" ? "🎁 Sent a gift" : (m.msg_type === "text" ? m.content : "Sent a " + m.msg_type);
      showToast("New message from " + m.sender_name);
      notifyDesktop(m.sender_name, preview);
    }
    return;
  }

  if (m.sender_id !== ME.id) {
    socket.emit("mark_read", {chat_type: currentChat.type, target: currentChat.id});
  }

  if (m.client_id && pendingMessages[m.client_id]) {
    const oldRow = pendingMessages[m.client_id];
    delete pendingMessages[m.client_id];
    messageCache[m.id] = m;
    const newRow = buildBubble(m);
    oldRow.replaceWith(newRow);
    return;
  }

  messageCache[m.id] = m;
  const body = document.getElementById("messagesBody");
  body.appendChild(buildBubble(m));

}

// ---- Copy Message Function ----
function copyMessage(messageId) {
  const m = messageCache[messageId];
  if (!m) {
    showToast("Message not found");
    return;
  }
  if (m.deleted) {
    showToast("Cannot copy a deleted message");
    return;
  }
  
  let textToCopy = "";
  if (m.msg_type === "text") {
    textToCopy = m.content || "";
  } else if (m.msg_type === "gift") {
    const gift = GIFTS.find(g => g.emoji === m.content) || { name: "Gift" };
    textToCopy = "🎁 " + gift.name;
  } else if (m.msg_type === "image") {
    textToCopy = "[Image]";
  } else if (m.msg_type === "video") {
    textToCopy = "[Video]";
  } else if (m.msg_type === "voice") {
    textToCopy = "[Voice message]";
  } else if (m.msg_type === "call") {
    const [ctype, status, dur] = (m.content || "audio:missed:0").split(":");
    const isVideo = ctype === "video";
    textToCopy = `${isVideo ? "Video" : "Voice"} call - ${status}`;
  } else {
    textToCopy = m.content || "";
  }
  
  if (currentChat && currentChat.type === "group" && m.sender_id !== ME.id) {
    textToCopy = m.sender_name + ": " + textToCopy;
  }
  
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textToCopy).then(() => {
      showToast("Message copied to clipboard");
    }).catch(() => {
      fallbackCopy(textToCopy);
    });
  } else {
    fallbackCopy(textToCopy);
  }
  
  document.querySelector(".overlay")?.remove();
}

function fallbackCopy(text) {
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.style.position = "fixed";
  textarea.style.left = "-9999px";
  textarea.style.top = "-9999px";
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand("copy");
    showToast("Message copied to clipboard");
  } catch (e) {
    showToast("Failed to copy message");
  }
  document.body.removeChild(textarea);
}

  let html = `<h2>Forward to...</h2><div class="search-bar" style="padding:0 0 12px;"><input id="forwardSearch" placeholder="Search..." oninput="filterForwardList(this.value)"></div><div id="forwardList"></div>`;
  sheet.innerHTML = html;
  overlay.appendChild(sheet);
  document.getElementById("app").appendChild(overlay);

  const seen = new Set();
  const targets = [];
  if (convosRes.conversations) {
    convosRes.conversations.forEach(c => { targets.push(c); seen.add(c.type+":"+c.id); });
  }
  if (peopleRes.users) {
    peopleRes.users.forEach(u => { if (!seen.has("dm:"+u.id)) targets.push({type:"dm", id:u.id, name:u.username, avatar:u.avatar}); });
  }

  window._forwardTargets = targets;
  window._forwardMessageId = messageId;
  renderForwardList(targets);
}

function filterForwardList(q){
  q = q.toLowerCase().trim();
  renderForwardList((window._forwardTargets||[]).filter(t => t.name && t.name.toLowerCase().includes(q)));
}

function renderForwardList(targets){
  const body = document.getElementById("forwardList");
  if (!body) return;
  if (!targets || targets.length === 0){ body.innerHTML = "<div class='empty-state'>No results</div>"; return; }
  body.innerHTML = "";
  targets.forEach(t => {
    const el = document.createElement("div");
    el.className = "list-item";
    el.onclick = () => confirmForward(t);
    el.innerHTML = `
      <div class="avatar">${t.avatar ? `<img src="${t.avatar}">` : (t.name ? t.name.charAt(0).toUpperCase() : "?")}</div>
      <div class="list-item-content"><div class="list-item-name">${escapeHtml(t.name)}</div>
      <div class="list-item-sub">${t.type==="group" ? "Group" : "Direct message"}</div></div>`;
    body.appendChild(el);
  });
}

function confirmForward(target){
  socket.emit("forward_message", {
    message_id: window._forwardMessageId,
    chat_type: target.type,
    target: target.id,
  });
  document.querySelector(".overlay")?.remove();
  showToast("Forwarded to " + target.name);
}

let reelsData = [];
let reelViewObserver = null;

async function loadReels(){
  const feed = document.getElementById("reelsFeed");
  try {
    const r = await api("/api/reels");
    reelsData = r.reels || [];
    renderReelsFeed();
  } catch(e){ showToast(e.message); }
}

function renderReelsFeed(){
  const feed = document.getElementById("reelsFeed");
  feed.innerHTML = "";
  if (!reelsData || reelsData.length === 0) {
    feed.innerHTML = `<div class="reel-item"><div class="reel-empty" style="color:#fff;text-align:center;padding:60px 30px;opacity:.7;font-size:14px;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
      <div style="font-size:48px;">🎬</div>
      <div>No reels yet.</div>
      <div style="font-size:13px;opacity:0.6;">Tap the + button to share your first photo or video.</div>
    </div></div>`;
    return;
  }
  if (reelViewObserver) reelViewObserver.disconnect();
  reelViewObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.dataset.reelId;
        if (id) registerReelView(id);
        const video = entry.target.querySelector("video");
        if (video) video.play().catch(()=>{});
      } else {
        const video = entry.target.querySelector("video");
        if (video) video.pause();
      }
    });
  }, {threshold: 0.5});

  reelsData.forEach((reel, index) => {
    const el = buildReelItem(reel, index);
    feed.appendChild(el);
    reelViewObserver.observe(el);
  });
}
